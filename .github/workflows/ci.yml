name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, coverage, package
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MINIMUM_LINE_COVERAGE: "55"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Run quality gate
        run: ./scripts/check.sh
        env:
          ORTU_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-coverage
          path: .build/**/codecov/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  intel-compatibility:
    name: Intel build and test
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test on x86_64
        run: swift test --parallel -Xswiftc -warnings-as-errors
